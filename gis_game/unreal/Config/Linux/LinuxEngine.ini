; Linux (Vulkan) overrides.
;
; UE 5.8.3 compiles the debug-only FSubsurfaceDebugCS global shader into invalid SPIR-V
; (a RWBuffer handle stored into local variables, VUID-StandaloneSpirv-OpTypeImage-06924).
; Precaching all global shaders at startup compiles it anyway, and Mesa's RADV driver
; (AMD GPUs) aborts on it: "ACO ERROR: Unimplemented intrinsic instr: @store_deref".
; Skipping startup precache means it is only compiled if used, which the game never does.
[ConsoleVariables]
r.PSOPrecache.GlobalShaders=0
